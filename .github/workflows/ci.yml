name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    name: Conformance (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SQLite with FTS5 and R*Tree
        # ubuntu-latest ships SQLite 3.45 with both extensions, which clears the
        # 3.34 floor the trigram tokenizer needs (ADR-003).
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Check SQLite capabilities
        run: |
          sqlite3 :memory: \
            "CREATE VIRTUAL TABLE t USING fts5(x, tokenize='trigram');" \
            "CREATE VIRTUAL TABLE r USING rtree(id, a, b, c, d);" \
            "SELECT 'fts5 trigram + rtree available';" || {
              echo "::error::SQLite lacks FTS5 trigram or R*Tree"
              exit 1
            }

      - name: Run test suites
        run: ./scripts/test.sh

      - name: Fail if docs disagree with docs
        # The specification is the source of truth for this project, and it is
        # read rather than run. A broken cross-reference sends a contributor to a
        # file that does not exist and they conclude the design was never decided.
        run: python3 tools/check_links.py

  reproducible:
    name: Reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the same country twice and compare checksums
        # PACKAGE_FORMAT.md section 12 makes this a testable property. Without
        # the test, "reproducible" is a claim.
        #
        # Georgia, not Türkiye: it is small enough to build twice inside a CI
        # budget and it exercises the optional-postal path, since GeoNames
        # publishes no postal file for it.
        run: ./scripts/check_reproducible.sh GE --level postal --download

  sdks:
    # One job for both SDKs rather than two, because they need the same three built packages and the
    # GeoNames downloads behind them. Splitting them would double the slowest part of CI to run the
    # same setup twice.
    name: SDK conformance (Swift + Kotlin)
    # macOS, because the Swift SDK needs the `SQLite3` module and Apple's toolchain is the one known
    # to ship it. On Linux `scripts/test.sh` checks for the module and skips the Swift suites with the
    # reason printed rather than failing on a missing platform feature.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Report the toolchain
        # Recorded rather than assumed: SDK_SPEC.md section 1.6 allows only the platform's own SQLite
        # binding, and a build that silently started vendoring a dependency manager would defeat it.
        run: |
          java -version
          swift --version
          swift -e 'import SQLite3; print("SQLite3 module available")'

      - name: Normalization conformance
        # Needs no packages, so it is the half that must pass on every push. It is what proves the
        # SDK agrees with core/spec/normalization.md rather than merely resembling it.
        run: cd sdk/swift && swift test --filter Normalization

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the packages the battery names
        # Build all MVP countries plus Japan: the shared battery includes US/GB queries,
        # and every implementation must read the same complete package set.
        run: |
          set -euo pipefail
          for COUNTRY in TR GE DE US GB JP; do
            echo "::group::$COUNTRY"
            PYTHONPATH=data-pipeline/src python3 -m terrakit_pipeline build \
              "$COUNTRY" \
              --level postal \
              --out "$PWD/.ci-datasets" \
              --repo-root "$PWD"
            echo "::endgroup::"
          done

      - name: Record the CLI's expectations, then check the CLI against them
        # The Rust CLI is the reference implementation, so the expectations are produced by it and
        # immediately verified against itself. That catches a battery that has drifted away from
        # the CLI before the Swift result is compared to anything.
        run: |
          set -euo pipefail
          cargo build --manifest-path cli/Cargo.toml --release --quiet
          python3 tools/conformance.py generate --packages .ci-datasets
          python3 tools/conformance.py check --packages .ci-datasets

      - name: Swift SDK conformance against the same package bytes
        # SDK_SPEC.md section 14: same battery, same bytes, compared on ID sequences and orderings
        # rather than counts.
        env:
          TERRAKIT_CONFORMANCE_PACKAGES: ${{ github.workspace }}/.ci-datasets
        run: cd sdk/swift && swift test

      - name: Kotlin SDK conformance against the same package bytes
        # A second oracle on top of the CLI's: Kotlin is held to the CLI *and* to Swift, which is the
        # only thing that makes SDK_SPEC.md section 1 -- both SDKs expose the same API in the same
        # shape -- testable rather than aspirational. ADR-008 makes the Android target conditional on
        # an SDK being present, so this builds the JVM variant only and says so.
        env:
          TERRAKIT_CONFORMANCE_PACKAGES: ${{ github.workspace }}/.ci-datasets
        run: |
          cd sdk/kotlin
          ./gradlew crossSdkConformance
          echo "note: the Android target is not built here -- no Android SDK on this runner (ADR-008)"

  package-validation:
    name: MVP package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A package with a validation error is not publishable (SPEC section 30),
      # so CI refuses to produce one.
      - name: Build and validate every MVP country
        run: |
          set -euo pipefail
          for COUNTRY in TR GE DE US GB JP; do
            echo "::group::$COUNTRY"
            PYTHONPATH=data-pipeline/src python3 -m terrakit_pipeline build \
              "$COUNTRY" \
              --level postal \
              --out "$PWD/.ci-datasets" \
              --repo-root "$PWD"
            echo "::endgroup::"
          done

      - name: Assert zero errors in every package
        run: |
          set -euo pipefail
          for DIR in .ci-datasets/terrakit-data-*; do
            echo "--- $DIR"
            PYTHONPATH=data-pipeline/src python3 -m terrakit_pipeline \
              validate "$DIR" --json
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mvp-packages
          path: .ci-datasets/*/manifest.json
          retention-days: 7

  cli:
    name: Rust CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      # The bundled SQLite build must contain FTS5 with the trigram tokenizer and
      # R*Tree. Without them the data model's search and nearest-location paths do
      # not exist, so this is checked rather than assumed (ADR-003, ADR-005).
      - name: Run CLI tests
        run: cargo test --manifest-path cli/Cargo.toml --verbose

      - name: Build release binary
        run: cargo build --manifest-path cli/Cargo.toml --release

      - name: Smoke test the binary
        run: |
          set -euo pipefail
          BIN=cli/target/release/terrakit
          "$BIN" --help > /dev/null
          "$BIN" version
          # Exit codes are part of the contract (CLI_SPEC.md section 1).
          "$BIN" search anything > /dev/null 2>&1 || true
          if "$BIN" bogus-command > /dev/null 2>&1; then
            echo "::error::an unknown command must exit non-zero"
            exit 1
          fi

      - name: Verify a real package end to end
        # Builds one country with the pipeline and queries it with the CLI. This is
        # the cross-component check that matters most: it proves the Python
        # pipeline's bytes, the Rust CLI's normalizer and the SQLite schema agree.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          python3 -m terrakit_pipeline build GE --level cities \
            --out "$RUNNER_TEMP/packages" --repo-root "$PWD" || \
            PYTHONPATH=data-pipeline/src python3 -m terrakit_pipeline build GE \
              --level cities --out "$RUNNER_TEMP/packages" --repo-root "$PWD"
      - name: Search the freshly built package with the CLI
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          REPO="$GITHUB_WORKSPACE"
          "$REPO/cli/target/release/terrakit" init
          python3 - "$RUNNER_TEMP" <<'PY'
          import pathlib, shutil, sys
          root = pathlib.Path(sys.argv[1])
          src = root / "packages"
          dst = root / ".terrakit" / "packages"
          for d in sorted(src.glob("terrakit-data-*")):
              country = d.name.split("-")[2].upper()
              version = d.name.split("-", 3)[3]
              (dst / country).mkdir(parents=True, exist_ok=True)
              shutil.copytree(d, dst / country / version, dirs_exist_ok=True)
          PY
          "$REPO/cli/target/release/terrakit" list
          "$REPO/cli/target/release/terrakit" validate
          "$REPO/cli/target/release/terrakit" search Tbilisi
          "$REPO/cli/target/release/terrakit" doctor

  registry:
    name: registry and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      # Publishes real packages to a static registry and installs them with the binary, then
      # attacks the result. The refusals are the substance: verification is demonstrated by
      # rejecting tampered, unsigned, forged and wrongly-signed packages with exit 3, not by
      # installing a good one.
      - name: Build the release binary
        run: cargo build --manifest-path cli/Cargo.toml --release

      - name: Cache the GeoNames sources
        uses: actions/cache@v4
        with:
          path: .cache/terrakit
          key: geonames-${{ hashFiles('data-pipeline/sources/SOURCES.lock') }}
          restore-keys: geonames-

      - name: Registry install and refusals
        env:
          TERRAKIT_CACHE: ${{ github.workspace }}/.cache/terrakit
          PKGS: TR GE
        run: bash scripts/test_registry.sh


  future:
    name: Swift SDK
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder until sdk/swift exists
        run: |
          if [ -d sdk/swift/Sources ]; then
            cd sdk/swift && swift build && swift test
          else
            echo "sdk/swift not implemented yet; skipping"
          fi

  future-kotlin:
    name: Kotlin SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Placeholder until sdk/kotlin exists
        run: |
          if [ -f sdk/kotlin/settings.gradle.kts ]; then
            cd sdk/kotlin && ./gradlew build
          else
            echo "sdk/kotlin not implemented yet; skipping"
          fi
