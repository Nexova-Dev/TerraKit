# Gradle daemon sizing.
#
# The conformance suite holds one SQLite connection per test class and each package is a few
# megabytes, so the memory ceiling is set for the heap and the daemon rather than left to the
# machine: a suite that passes on a workstation and dies with OutOfMemoryError on a 7 GB CI runner
# is a suite whose result depends on the host.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true